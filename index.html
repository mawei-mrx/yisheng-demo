function b64ToUrl(s) {
  var bin = atob(s), len = bin.length, bytes = new Uint8Array(len);
  for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  var txt = new TextDecoder('utf-8').decode(bytes);
  return URL.createObjectURL(new Blob([txt], { type: 'text/html' }));
}

var made = {};
function view(v) {
  var btns = document.querySelectorAll('.seg button');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-view') === v);
  document.getElementById('frameApp').style.display = v === 'app' ? 'block' : 'none';
  document.getElementById('frameAdmin').style.display = v === 'admin' ? 'block' : 'none';
}

document.getElementById('frameApp').src = b64ToUrl(APP_B64);
document.getElementById('frameAdmin').src = b64ToUrl(ADMIN_B64);

document.querySelectorAll('.seg button').forEach(function (b) {
  b.addEventListener('click', function () { view(b.getAttribute('data-view')); });
});

window.addEventListener('message', function (e) {
  if (e.data && e.data.type === 'showApp') view('app');
});

view('app');
</script>
